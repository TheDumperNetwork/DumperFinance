<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dumper Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F4F6F5;--panel:#fff;--line:#E4E9E6;--text:#101614;--mute:#66706B;--gold:#0B7A5A;--violet:#4F46E5;--mint:#0E9F6E;--rose:#DC4A4A;--r:22px;--sh:0 1px 2px rgba(16,24,20,.04),0 14px 34px -18px rgba(16,24,20,.16)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14.5px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);background:var(--bg);background-image:radial-gradient(800px 420px at 92% -8%,rgba(16,185,129,.14),transparent 60%),radial-gradient(700px 420px at -8% 0,rgba(79,70,229,.08),transparent 60%);background-attachment:fixed;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,.serif,.big,.lh{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{position:sticky;top:0;height:100vh;padding:26px 16px;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);border-right:1px solid var(--line)}
.logo{font:26px 'Instrument Serif',serif;padding:0 10px 22px;display:flex;align-items:center;gap:11px}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#0B7A5A,#4F46E5);box-shadow:0 6px 16px -6px rgba(11,122,90,.7)}
.nav{background:none;border:0;text-align:left;padding:11px 14px;border-radius:13px;color:var(--mute);cursor:pointer;font-weight:600}
.nav:hover{color:var(--text);background:rgba(16,24,20,.04)}
.nav.on{background:rgba(11,122,90,.1);color:var(--gold)}
.nav svg{vertical-align:-4px;margin-right:11px}
.sp{flex:1}.tiny{font-size:13px;padding:8px 14px}
main{padding:38px clamp(18px,4vw,52px) 64px;max-width:1200px;width:100%}
.top{display:flex;gap:14px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
h1{font-size:clamp(34px,4.6vw,48px);line-height:1.05}
.sub{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.5fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:34px;margin-bottom:16px;position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,#052E23 0%,#0B5E47 55%,#12936F 100%);box-shadow:0 30px 60px -28px rgba(5,46,35,.7)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%)}
.hero>*{position:relative;z-index:1}
.hero .lbl,.hero .sub{color:rgba(255,255,255,.74)}.hero .neg{color:#FCA5A5}
.big{font-size:clamp(46px,6.5vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.lbl{color:var(--mute);font-size:13px;font-weight:500;margin-bottom:6px}
.pos{color:var(--mint)}.neg{color:var(--rose)}.gold{color:var(--gold)}
.ring{position:relative;width:150px;height:150px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:400 38px 'Instrument Serif',serif}
.ring small{display:block;font:500 12px 'Plus Jakarta Sans';color:rgba(255,255,255,.75)}
.qa{display:flex;gap:8px;width:min(480px,100%)}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 4px rgba(11,122,90,.12)}
.pri,.ghost{border-radius:13px;padding:11px 18px;border:1px solid var(--line);cursor:pointer;white-space:nowrap;font-weight:700}
.pri{background:linear-gradient(135deg,#0B7A5A,#12936F);color:#fff;border:0;box-shadow:0 10px 22px -10px rgba(11,122,90,.7)}
.pri:hover{filter:brightness(1.07)}.ghost{background:#fff}.ghost:hover{background:#F0F4F2}
.qa .ghost{padding:9px 12px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
table{width:100%;border-collapse:collapse}td,th{padding:13px 6px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}tr:last-child td{border:0}
th{color:var(--mute);font-size:12.5px;font-weight:600}td.r,th.r{text-align:right}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:19px}.x:hover{color:var(--rose)}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;background:#EEF2F0;font-size:12px;font-weight:600;color:var(--mute)}
.chip svg{vertical-align:-2px;margin-right:4px;width:13px;height:13px}
button.chip{border:0;color:var(--text);cursor:pointer}button.chip:hover{background:#E1E8E4}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badges .chip{padding:6px 13px;font-size:13px}
.bar{height:9px;border-radius:9px;background:#EAEFEC;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#0B7A5A,#34D399)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:10px}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.empty{color:var(--mute);padding:28px 0;text-align:center}
dialog{margin:auto;border:0;border-radius:var(--r);background:#fff;color:var(--text);padding:28px;width:min(430px,92vw);box-shadow:0 40px 90px -30px rgba(16,24,20,.5)}
dialog::backdrop{background:rgba(16,24,20,.42);backdrop-filter:blur(5px)}
dialog h3{font-size:28px;margin-bottom:16px}dialog label{display:block;color:var(--mute);font-size:13px;font-weight:500;margin-bottom:13px}dialog label>*{margin-top:6px;color:var(--text)}
.hide .amt{filter:blur(9px)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sec h3{font-size:25px}
.chat{display:flex;flex-direction:column;height:min(64vh,580px);padding:18px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px 4px 14px}
.m{max-width:84%;padding:12px 16px;border-radius:19px;white-space:pre-wrap}
.m.ai{background:#F2F5F3;border-bottom-left-radius:6px;align-self:flex-start}
.m.me{background:linear-gradient(135deg,#0B7A5A,#12936F);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.orb{display:inline-block;width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 25%,#fff,#A7F3D0 30%,#34D399 60%,#0B7A5A);box-shadow:0 10px 26px -6px rgba(11,122,90,.65);animation:pulse 3.6s ease-in-out infinite}
.orb.big{width:84px;height:84px}.orb.think{animation-duration:.9s}
@keyframes pulse{50%{transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.land{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.lh{font-size:clamp(46px,8.5vw,96px);line-height:.98;max-width:11em}
.demo{width:min(440px,100%);display:flex;flex-direction:column;gap:10px;margin-top:30px;text-align:left}
.landing aside{display:none}.landing .app{grid-template-columns:1fr}
@media(max-width:860px){
.app{grid-template-columns:1fr}
aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border:0;border-top:1px solid var(--line);z-index:5;justify-content:space-around}
.logo,.sp,.side{display:none}.nav{padding:9px 10px}.nav span{display:none}.nav svg{margin:0;width:22px;height:22px}
.g3,.g2,.g2e{grid-template-columns:1fr}main{padding-bottom:110px}.hero{flex-direction:column;align-items:flex-start}}
</style></head>
<body>
<div class="app">
<aside>
<div class="logo"><i></i>Dumper Finance</div>
<button class="nav" data-v="dash" title="Overview" aria-label="Overview"><i data-ic="home"></i><span>Overview</span></button>
<button class="nav" data-v="ai" title="Ask Dumper Vega" aria-label="Ask Dumper Vega"><i data-ic="vega"></i><span>Ask Dumper Vega</span></button>
<button class="nav" data-v="acc" title="Balance sheet" aria-label="Balance sheet"><i data-ic="sheet"></i><span>Balance sheet</span></button>
<button class="nav" data-v="tx" title="Transactions" aria-label="Transactions"><i data-ic="tx"></i><span>Transactions</span></button>
<button class="nav" data-v="plan" title="Plan" aria-label="Plan"><i data-ic="plan"></i><span>Plan</span></button>
<button class="nav" data-v="invest" title="Investments" aria-label="Investments"><i data-ic="invest"></i><span>Investments</span></button>
<button class="nav" data-v="funds" title="Funds" aria-label="Funds"><i data-ic="funds"></i><span>Funds</span></button>
<button class="nav" data-v="tools" title="Calculators" aria-label="Calculators"><i data-ic="calc"></i><span>Calculators</span></button>
<button class="nav" data-v="acct" title="Account" aria-label="Account"><i data-ic="user"></i><span>Account</span></button>
<div class="sp"></div>
<div class="sub side" id="sync" style="font-size:12px;padding:0 14px 4px"></div>
<button class="nav tiny side" id="priv">Hide amounts</button>
<button class="nav tiny side" id="exp">Export data</button>
<button class="nav tiny side" id="imp">Import data</button>
<button class="nav tiny side" id="demo">Load sample data</button>
<input type="file" id="file" accept=".json" hidden>
</aside>
<main id="v"></main>
</div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const CATS=['Food','Transport','Bills','Rent','Shopping','Health','Fun','Salary','Other'];
const COL=['#4F46E5','#0E9F6E','#F59E0B','#DC4A4A','#0EA5E9','#F97316','#A855F7','#84CC16','#94A3B8'];
const KW={Food:/food|grocer|lunch|dinner|coffee|swiggy|zomato|restaurant/i,Transport:/petrol|fuel|uber|ola|metro|bus|cab|train/i,Bills:/bill|recharge|netflix|electric|wifi|emi|subscription/i,Rent:/rent/i,Shopping:/shop|amazon|clothes|phone|shoes/i,Health:/doctor|medicine|gym|pharmacy/i,Fun:/movie|game|party|trip|concert/i,Salary:/salary|stipend|pay\b/i};
let S;try{S=JSON.parse(localStorage.getItem('dfin'))}catch(e){}
S=S||{acc:[{id:1,name:'Cash',type:'a',bal:0},{id:2,name:'Bank account',type:'a',bal:0}],tx:[],goals:[],priv:false};
S.hold=S.hold||[];S.rec=S.rec||[];S.rem=S.rem||[];S.sp=S.sp||{people:[],items:[]};S.budgets=S.budgets||{};S.bills=S.bills||[];S.cfg=S.cfg||{};
let view=S.cfg.seen?'dash':'home',q='';
const save=()=>{try{localStorage.setItem('dfin',JSON.stringify(S))}catch(e){}push()};
const id=()=>Date.now()+Math.floor(Math.random()*999);
const today=()=>new Date().toISOString().slice(0,10);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const amt=n=>`<span class="amt">${inr(n)}</span>`;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const accName=i=>(S.acc.find(a=>a.id==i)||{name:'—'}).name;

function stats(){
const m=today().slice(0,7);
const mt=S.tx.filter(t=>t.date.startsWith(m));
const inc=mt.filter(t=>t.type=='in').reduce((s,t)=>s+t.amt,0);
const out=mt.filter(t=>t.type=='out').reduce((s,t)=>s+t.amt,0);
const A=S.acc.filter(a=>a.type=='a').reduce((s,a)=>s+a.bal,0);
const L=S.acc.filter(a=>a.type=='l').reduce((s,a)=>s+a.bal,0);
const sr=inc>0?(inc-out)/inc:0;
const mexp=Math.max(out,1);
const goalSaved=S.goals.reduce((s,g)=>s+g.saved,0);
const score=Math.round(40*clamp(sr/.3)+30*(A>0?clamp(1-L/A):0)+30*clamp((A)/(6*mexp)));
return{inc,out,A,L,nw:A-L,sr,score,goalSaved,mt};
}
function apply(t,k){const a=S.acc.find(a=>a.id==t.acc);if(!a)return;const up=(t.type=='in')==(a.type=='a');a.bal+=(up?1:-1)*t.amt*k}
function addTx(t){t.id=id();S.tx.push(t);apply(t,1);save();render()}
function delTx(i){const t=S.tx.find(t=>t.id==i);apply(t,-1);S.tx=S.tx.filter(t=>t.id!=i);save();render()}

function form(title,fields,cb){
const d=$('#dlg');
d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${f.v||''}" ${f.t=='number'?'step="any" min="0"':''} ${f.n?'':'required'}>`}</label>`).join('')}<div class="row"><button value="x" class="ghost" formnovalidate>Cancel</button><button value="ok" class="pri">Save</button></div></form>`;
d.onclose=()=>{if(d.returnValue=='ok'){cb(Object.fromEntries(new FormData(d.querySelector('form'))))}d.returnValue=''};
d.showModal();
}
const txForm=(pre={})=>form('Add transaction',[
{k:'type',l:'Type',o:[['out','Expense'],['in','Income']]},
{k:'amt',l:'Amount (₹)',t:'number',v:pre.amt},
{k:'cat',l:'Category',o:CATS.map(c=>[c,c])},
{k:'acc',l:'Account',o:S.acc.map(a=>[a.id,a.name])},
{k:'date',l:'Date',t:'date',v:pre.date||today()},
{k:'note',l:'Note or tag',n:1,v:pre.note}],
d=>addTx({type:d.type,amt:+d.amt,cat:d.cat,acc:+d.acc,date:d.date,note:d.note}));

function quick(text){
const s=text.trim();if(!s)return;
let m=s.match(/(\d[\d,]*(?:\.\d+)?)/);if(!m)return alert('Include an amount, like "spent 450 on groceries".');
const n=+m[1].replace(/,/g,'');
const type=/got|received|earned|salary|credited|income/i.test(s)?'in':'out';
let cat=type=='in'?'Salary':'Other';
for(const k in KW)if(KW[k].test(s)){cat=k;break}
const d=new Date();if(/yesterday/i.test(s))d.setDate(d.getDate()-1);
const acc=(S.acc.find(a=>a.type=='a')||S.acc[0]);
if(!acc)return alert('Add an account first.');
addTx({type,amt:n,cat,acc:acc.id,date:d.toISOString().slice(0,10),note:s});
}

function ring(p,size=150){const r=62,c=2*Math.PI*r;return`<svg width="${size}" height="${size}" viewBox="0 0 150 150"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#6EE7B7"/></linearGradient></defs><circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="9"/><circle class="arc" cx="75" cy="75" r="${r}" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}
function donut(){
const by={};S.tx.filter(t=>t.type=='out'&&t.date.startsWith(today().slice(0,7))).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);const tot=ent.reduce((s,e)=>s+e[1],0);
if(!tot)return'<div class="empty">No spending yet this month.</div>';
let off=0;const r=44,c=2*Math.PI*r;
const arcs=ent.map((e,i)=>{const l=e[1]/tot*c;const s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${COL[CATS.indexOf(e[0])%COL.length]}" stroke-width="14" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('');
return`<div style="display:flex;justify-content:center"><svg width="190" height="190" viewBox="0 0 120 120" style="transform:rotate(-90deg)">${arcs}</svg></div><div class="leg">${ent.map(e=>`<span><i style="background:${COL[CATS.indexOf(e[0])%COL.length]}"></i>${e[0]} <span class="amt">${inr(e[1])}</span></span>`).join('')}</div>`}
function trend(){
const st=stats();const days=30;let nw=st.nw;const pts=[];
for(let i=0;i<=days;i++){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);pts.unshift(nw);
S.tx.filter(t=>t.date==k).forEach(t=>nw-=(t.type=='in'?1:-1)*t.amt)}
const mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
const P=pts.map((v,i)=>`${(i/days*400).toFixed(1)},${(100-(v-mn)/rg*84-8).toFixed(1)}`);
if(pts.every(v=>v===pts[0])&&!S.tx.length)return'<div class="empty">Add a transaction to see your net worth move.</div>';
return`<svg viewBox="0 0 400 100" width="100%" height="170" preserveAspectRatio="none"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B7A5A" stop-opacity=".25"/><stop offset="1" stop-color="#0B7A5A" stop-opacity="0"/></linearGradient></defs><polygon points="0,100 ${P.join(' ')} 400,100" fill="url(#a)"/><polyline points="${P.join(' ')}" fill="none" stroke="#0B7A5A" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg><div class="leg"><span>Net worth, last 30 days</span></div>`}

function txRows(list,del){
if(!list.length)return'<div class="empty">No transactions yet. Add one, or type "spent 450 on groceries" above.</div>';
return`<table><tr><th>Date</th><th>Details</th><th>Account</th><th class="r">Amount</th>${del?'<th></th>':''}</tr>${list.map(t=>`<tr><td>${t.date.slice(5)}</td><td>${esc(t.note||t.cat)} <span class="chip">${ic(t.cat)}${t.cat}</span></td><td class="sub">${esc(accName(t.acc))}</td><td class="r ${t.type=='in'?'pos':''}">${t.type=='in'?'+':'−'}${amt(t.amt)}</td>${del?`<td class="r"><button class="x" onclick="delTx(${t.id})" aria-label="Delete">×</button></td>`:''}</tr>`).join('')}</table>`}
const sorted=()=>[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

const V={
dash(){const s=stats();return`
<div class="top"><div><h1>Your money, at a glance</h1><p class="sub">Everything below updates as you add transactions.</p></div>
<form class="qa" onsubmit="quick(this.q.value);return false"><input name="q" placeholder='Try: spent 450 on groceries' aria-label="Quick add"><button class="pri">Add</button></form></div>
<div class="card hero"><div><div class="lbl">Net worth</div><div class="big ${s.nw<0?'neg':''}">${amt(s.nw)}</div>
<p class="sub" style="margin-top:10px">Assets ${amt(s.A)} · Debts ${amt(s.L)}</p></div>
<div class="ring">${ring(s.score/100)}<b><span>${s.score}<small>Health score</small></span></b></div></div>
<div class="grid g3" style="margin-bottom:16px">
<div class="card"><div class="lbl">Income this month</div><div class="serif pos" style="font-size:30px">${amt(s.inc)}</div></div>
<div class="card"><div class="lbl">Spent this month</div><div class="serif neg" style="font-size:30px">${amt(s.out)}</div></div>
<div class="card"><div class="lbl">Savings rate</div><div class="serif gold" style="font-size:30px">${s.inc?Math.round(s.sr*100)+'%':'—'}</div></div></div>
${vegaCard()}${streakCard()}<div class="grid g2" style="margin-bottom:16px"><div class="card"><div class="sec"><h3>Net worth trend</h3></div>${trend()}</div>
<div class="card"><div class="sec"><h3>Where it went</h3></div>${donut()}</div></div>
<div class="card"><div class="sec"><h3>Recent activity</h3><button class="ghost" onclick="txForm()">Add transaction</button></div>${txRows(sorted().slice(0,6))}</div>`},
acc(){const s=stats();const blk=(t,name)=>{const l=S.acc.filter(a=>a.type==t);return`<div class="card"><div class="sec"><h3>${name}</h3><span class="serif ${t=='a'?'pos':'neg'}" style="font-size:22px">${amt(t=='a'?s.A:s.L)}</span></div>${l.length?`<table>${l.map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${amt(a.bal)}</td><td class="r"><button class="x" onclick="delAcc(${a.id})" aria-label="Delete">×</button></td></tr>`).join('')}</table>`:'<div class="empty">Nothing here yet.</div>'}</div>`};
return`<div class="top"><div><h1>Balance sheet</h1><p class="sub">What you own, what you owe, and what is left.</p></div><button class="pri" onclick="accForm()">Add account</button></div>
<div class="card hero" style="margin-bottom:16px"><div><div class="lbl">Net worth = assets − debts</div><div class="big ${s.nw<0?'neg':''}">${amt(s.nw)}</div></div></div>

function calc(){
const g=i=>+$('#'+i).value||0;
const P=g('e1'),r=g('e2')/1200,n=g('e3')*12;
const emi=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/(n||1);
$('#eo').textContent=inr(emi||0);$('#eo2').textContent='Total interest: '+inr((emi*n-P)||0);
const m=g('s1'),i=g('s2')/1200,k=g('s3')*12;
const fv=i?m*((Math.pow(1+i,k)-1)/i)*(1+i):m*k;
$('#so').textContent=inr(fv);$('#so2').textContent='You invest '+inr(m*k)+', growth adds '+inr(fv-m*k);taxCalc();calc2f();
}

const NEW=[[4e5,0],[8e5,.05],[12e5,.1],[16e5,.15],[2e6,.2],[24e5,.25],[Infinity,.3]],OLD=[[25e4,0],[5e5,.05],[1e6,.2],[Infinity,.3]];
const slab=(x,s)=>{let t=0,lo=0;for(const[hi,r]of s){if(x>lo)t+=(Math.min(x,hi)-lo)*r;lo=hi}return t};
const taxCard=()=>`<div class="card" style="grid-column:1/-1"><div class="sec"><h3>Income tax: old vs new regime</h3></div><div class="grid g2e"><label class="sub">Yearly salary income (₹)<input id="t1" type="number" value="1500000" oninput="calc()"></label><label class="sub">Old-regime deductions: 80C, HRA, 80D and more (₹)<input id="t2" type="number" value="150000" oninput="calc()"></label></div><div id="t3" style="margin-top:16px"></div><p class="sub" style="font-size:13px;margin-top:8px">Estimate for salaried people using FY 2025-26 slabs, the standard deduction and 4% cess. Slabs change, so confirm on the income tax portal or with a CA before filing.</p></div>`;
function taxCalc(){const g=i=>+$('#'+i).value||0,inc=g('t1'),ded=g('t2'),nt=Math.max(0,inc-75000),ot=Math.max(0,inc-50000-ded);
const n=(nt<=12e5?0:Math.min(slab(nt,NEW),nt-12e5))*1.04,o=(ot<=5e5?0:slab(ot,OLD))*1.04;
$('#t3').innerHTML=`<div class="grid g3"><div><div class="lbl">New regime</div><div class="serif" style="font-size:26px">${amt(n)}</div></div><div><div class="lbl">Old regime</div><div class="serif" style="font-size:26px">${amt(o)}</div></div><div><div class="lbl">Better for you</div><div class="serif gold" style="font-size:26px">${n<=o?'New':'Old'} regime</div><div class="sub">Saves ${amt(Math.abs(n-o))} a year</div></div></div>`}


const SB_URL='',SB_KEY=''; // paste your Supabase project URL and anon key between the quotes
let sb=null,user=null,vaults=[],vid=localStorage.getItem('dfin_vault'),lastTs='',timer,ch;
try{if(window.supabase&&SB_URL&&SB_KEY)sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const setSync=t=>{const e=$('#sync');if(e)e.textContent=t};
const strip=o=>{const{cfg,...d}=o;return d};
const fresh=()=>({acc:[{id:1,name:'Cash',type:'a',bal:0},{id:2,name:'Bank account',type:'a',bal:0}],tx:[],goals:[],budgets:{},bills:[],hold:[],rec:[],rem:[],sp:{people:[],items:[]}});
function push(){if(!sb||!user||!vid)return;setSync('Saving…');clearTimeout(timer);timer=setTimeout(async()=>{lastTs=new Date().toISOString();const r=await sb.from('vaults').update({data:strip(S),updated_at:lastTs}).eq('id',vid);setSync(r.error?'Sync error: '+r.error.message:'Synced')},700)}
function applyData(d){S=Object.assign({priv:!!S.priv},fresh(),d,{cfg:S.cfg});try{localStorage.setItem('dfin',JSON.stringify(S))}catch(e){}render()}
function unsub(){if(ch&&sb){sb.removeChannel(ch);ch=null}}
function subscribe(){unsub();ch=sb.channel('v'+vid).on('postgres_changes',{event:'UPDATE',schema:'public',table:'vaults',filter:'id=eq.'+vid},p=>{if(lastTs&&new Date(p.new.updated_at).getTime()===new Date(lastTs).getTime())return;const v=vaults.find(v=>v.id==vid);if(v)v.data=p.new.data;applyData(p.new.data);setSync('Updated from another device')}).subscribe()}
function openVault(){const v=vaults.find(v=>v.id==vid);applyData(v.data&&v.data.acc?v.data:fresh());runRec();subscribe();setSync('Synced')}
async function loadVaults(){const cols='id,name,code,owner,data';let r=await sb.from('vaults').select(cols);if(r.error)return setSync('Error: '+r.error.message);vaults=r.data;
if(!vaults.length){r=await sb.from('vaults').insert({name:'Personal',data:strip(S)}).select(cols).single();if(r.error)return setSync('Error: '+r.error.message);vaults=[r.data]}
if(!vaults.find(v=>v.id==vid))vid=vaults[0].id;localStorage.setItem('dfin_vault',vid);openVault()}
async function boot(){if(!sb)return;const{data}=await sb.auth.getSession();user=data.session&&data.session.user;

const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0],up=S.bills.filter(b=>due(b)<=7).map(b=>`${b.name} (${inr(b.amt)}, ${due(b)?'in '+due(b)+' days':'today'})`),al=alerts();

function csvRows(t){const R=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=0;else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))R.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))R.push(r);return R}

function importCsv(f){if(!f)return;const r=new FileReader();r.onload=()=>{const R=csvRows(String(r.result)),hi=R.findIndex(x=>x.some(c=>/date/i.test(c))&&x.some(c=>/debit|withdraw|amount|credit|deposit/i.test(c)));
if(hi<0)return alert('Could not find a header row with Date and Amount or Debit/Credit columns. Export your statement as CSV and try again.');
const H=R[hi].map(x=>x.toLowerCase()),ix=re=>H.findIndex(h=>re.test(h)),D=ix(/date/),N=ix(/narration|description|particulars|details|remarks/),Db=ix(/debit|withdraw/),Cr=ix(/credit|deposit/),Am=ix(/^amount/),acc=S.acc.find(a=>a.type=='a');
if(!acc)return alert('Add an asset account first.');let n=0;const num=v=>parseFloat(String(v||'').replace(/[^\d.\-]/g,''))||0;
R.slice(hi+1).forEach(x=>{const date=pd(x[D]||'');if(!date)return;let o=Db>=0?num(x[Db]):0,i=Cr>=0?num(x[Cr]):0;if(Am>=0&&!o&&!i){const a=num(x[Am]);if(a<0)o=-a;else i=a}
const v=o||i;if(!v)return;const type=o?'out':'in',note=(x[N]||'').trim().slice(0,60);if(S.tx.some(t=>t.date==date&&t.amt==v&&t.note==note))return;
let cat=type=='in'?'Salary':'Other';for(const k in KW)if(KW[k].test(note)){cat=k;break}
const t={id:id(),type,amt:v,cat,acc:acc.id,date,note};S.tx.push(t);apply(t,1);n++});
save();render();alert(`Imported ${n} transactions into ${acc.name}.`)};r.readAsText(f)}

function payoff(D,ex,ord){D=D.map(d=>({...d}));let m=0,int=0;while(D.some(d=>d.b>0)&&m<600){m++;let pool=ex;D.forEach(d=>{if(d.b>0){const i=d.b*d.r/1200;int+=i;d.b+=i;d.b-=Math.min(d.m,d.b)}else pool+=d.m});const t=D.filter(d=>d.b>0).sort(ord)[0];if(t)t.b-=Math.min(pool,t.b)}return{m,int}}

function calc2f(){const g=i=>+$('#'+i).value||0;
const C=g('c1'),pf=C*g('c2')/100*.12,pt=g('c3'),tb=Math.max(0,C-pf-75000),tax=(tb<=12e5?0:Math.min(slab(tb,NEW),tb-12e5))*1.04;
